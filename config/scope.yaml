# The safety fence. Only these addresses may be imported; everything else is refused
# before any scan file is read. Three /32s rather than the /24 so the canary is provably outside.
# 127.0.0.1/32 authorises the local real-lab host (Juice Shop / WebGoat / local services);
# it is this machine itself, scanned with owner consent. Everything else stays refused.
allowed_cidrs: [172.28.0.10/32, 172.28.0.11/32, 172.28.0.12/32, 127.0.0.1/32]
allowed_hosts: []
vantage: internal
lab_targets:
  - {name: metasploitable2, ip: 172.28.0.10, tags: {environment: test}}
  - {name: dvwa,            ip: 172.28.0.11, tags: {environment: prod, criticality: 4}}
  - {name: juice-shop,      ip: 172.28.0.12, tags: {environment: prod, criticality: 3, vantage: external}}
  - {name: real-local-lab,  ip: 127.0.0.1,  tags: {environment: test, criticality: 3}}
canary: {ip: 172.28.0.250}
