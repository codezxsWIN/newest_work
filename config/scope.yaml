allowed_cidrs: [172.28.0.10/32, 172.28.0.11/32, 172.28.0.12/32]
allowed_hosts: []
vantage: internal
lab_targets:
  - {name: metasploitable2, ip: 172.28.0.10, tags: {environment: test}}
  - {name: dvwa,            ip: 172.28.0.11, tags: {environment: prod, criticality: 4}}
  - {name: juice-shop,      ip: 172.28.0.12, tags: {environment: prod, criticality: 3, vantage: external}}
canary: {ip: 172.28.0.250}
