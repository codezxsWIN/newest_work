[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnassess"
version = "0.2.0"
description = "Local-first, lab-scoped, context-aware vulnerability prioritisation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml",
    "packaging",
]

[project.scripts]
vulnassess = "vulnassess.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["vulnassess*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
