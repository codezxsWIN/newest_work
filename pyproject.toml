[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vulnassess"
version = "0.1.0"
description = "Local-first, lab-scoped vulnerability prioritisation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "pydantic>=2,<3",
    "httpx",
    "rich",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
vulnassess = "vulnassess.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vulnassess*"]

[tool.setuptools.package-data]
"vulnassess.report" = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
