# Scanning scope. THE tool refuses anything not listed here, before any process starts.
# Only the isolated lab network is authorised. Never add a real or university network.
allowed_cidrs:
  - 172.28.0.0/24
allowed_hosts: []
vantage: internal

lab_targets:
  - name: metasploitable2
    ip: 172.28.0.10
    tags:
      environment: test
  - name: dvwa
    ip: 172.28.0.11
    tags:
      environment: prod
      criticality: 4
  - name: juice-shop
    ip: 172.28.0.12
    tags:
      environment: prod
      criticality: 3
      vantage: external     # simulates an internet-facing host

# Canary: NOT in scope. Its access log must stay empty after every run.
canary:
  ip: 172.28.0.250
